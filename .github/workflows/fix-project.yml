name: Fix ALFA KADE structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        run: |
          ZIP=$(find . -name "ALFA-KADE-proper.zip" -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          cp "$ZIP" /tmp/alfa-kade.zip

      - name: Clean old files
        run: |
          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            -exec rm -rf {} +

      - name: Extract project
        run: |
          unzip -o /tmp/alfa-kade.zip -d .
          find . -maxdepth 2 -type f | sort | head -100

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ALFA KADE project structure" || echo "No changes"
          git push
